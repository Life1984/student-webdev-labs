<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Exercise 02 - Form</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <!-- Main Page -->
    <main class="container my-5">
      <!-- Calculator Card Container -->
      <section class="card shadow-sm mx-auto col-12 col-md-8 col-lg-6">
        <div class="card-body p-4 p-md-5">
          <!-- Page Title/Heading -->
          <h1 class="text-center fw-bold mb-4">Roth IRA Calculator</h1>
          <!-- Roth IRA Calculator Form -->
          <form>
            <!-- Balance Input -->
            <div class="row mb-3 align-items-center">
              <label for="balance" class="col-12 col-lg-6 col-form-label">
                Balance ($)
              </label>
              <div class="col-12 col-lg-6">
                <input
                  type="text"
                  class="form-control"
                  id="balance"
                  name="balance"
                />
              </div>
            </div>
            <!-- Annual Contribution Input -->
            <div class="row mb-3 align-items-center">
              <label
                for="annualContribution"
                class="col-12 col-lg-6 col-form-label"
              >
                Annual Contribution ($)
              </label>
              <div class="col-12 col-lg-6">
                <input
                  type="text"
                  class="form-control"
                  id="annualContribution"
                  name="annualContribution"
                />
              </div>
            </div>
            <!-- Radio Button Group -->
            <fieldset class="row mb-3">
              <legend class="col-12 col-lg-6 col-form-label pt-0">
                Maximize contributions?
              </legend>
              <div class="col-12 col-lg-6">
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="maximizeContributions"
                    id="maximizeYes"
                    value="yes"
                  />
                  <label class="form-check-label" for="maximizeYes">
                    Yes
                  </label>
                </div>
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="maximizeContributions"
                    id="maximizeNo"
                    value="no"
                  />
                  <label class="form-check-label" for="maximizeNo"> No </label>
                </div>
              </div>
            </fieldset>
            <!-- Expected Return Input -->
            <div class="row mb-3 align-items-center">
              <label
                for="expectedReturn"
                class="col-12 col-lg-6 col-form-label"
              >
                Expected return (%)
              </label>
              <div class="col-12 col-lg-6">
                <input
                  type="number"
                  class="form-control"
                  id="expectedReturn"
                  name="expectedReturn"
                />
              </div>
            </div>
            <!-- Current Age Input -->
            <div class="row mb-3 align-items-center">
              <label for="currentAge" class="col-12 col-lg-6 col-form-label">
                Current age
              </label>
              <div class="col-12 col-lg-6">
                <input
                  type="number"
                  class="form-control"
                  id="currentAge"
                  name="currentAge"
                />
              </div>
            </div>
            <!-- Retirement Age Input -->
            <div class="row mb-3 align-items-center">
              <label for="retirementAge" class="col-12 col-lg-6 col-form-label">
                Retirement age
              </label>
              <div class="col-12 col-lg-6">
                <input
                  type="number"
                  class="form-control"
                  id="retirementAge"
                  name="retirementAge"
                />
              </div>
            </div>
            <!-- Tax Rate Input -->
            <div class="row mb-4 align-items-center">
              <label for="taxRate" class="col-12 col-lg-6 col-form-label">
                Tax rate (%)
              </label>
              <div class="col-12 col-lg-6">
                <input
                  type="number"
                  class="form-control"
                  id="taxRate"
                  name="taxRate"
                />
              </div>
            </div>
            <!-- Form Buttons -->
            <div class="row g-2 mb-4">
              <div class="col-6">
                <button type="submit" class="btn btn-primary w-100">
                  Calculate
                </button>
              </div>
              <div class="col-6">
                <button type="reset" class="btn btn-outline-secondary w-100">
                  Reset
                </button>
              </div>
            </div>
            <!-- Source Note -->
            <p class="text-secondary mb-0">
              This exercise is a simplified version of the Roth IRA Calculator
              <a href="https://www.calculator.net/roth-ira-calculator.html">
                Calculator.net
              </a>
            </p>
          </form>
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
